name: Release

# Builds agntchat desktop installers for macOS (Apple Silicon + Intel) and
# Windows on every version tag (v*) and uploads them to a DRAFT GitHub Release
# for James to review before publishing.
#
# macOS builds are signed with a Developer ID certificate AND notarized by
# Apple, so they open with a normal double-click. Windows is still unsigned —
# users click through SmartScreen — pending a Windows code-signing certificate.
#
# Notarization is not optional decoration: a signed-but-unnotarized app is
# still blocked by Gatekeeper on any Mac that downloaded it. Both halves have
# to work, which is why the build takes longer than it used to (Apple's
# notary service round-trip).
#
# Separately from OS code-signing, every build IS signed with the Tauri updater
# keypair (TAURI_SIGNING_PRIVATE_KEY). That signature is what the installed app
# verifies against `plugins.updater.pubkey` in tauri.conf.json before it will
# install an update — so it is required, not optional, and the two kinds of
# signing are unrelated.
#
# Release flow:
#   npm run bump minor && git commit && git tag v0.11.0 && git push --tags
#   → this workflow builds all three targets into ONE draft release
#   → review the draft, then Publish
#   → publishing is what makes `/releases/latest/download/latest.json` resolve,
#     which is the moment installed apps start offering the update.

on:
  push:
    tags:
      - "v*"

# Needed for tauri-action to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build ${{ matrix.platform }} ${{ matrix.target }}
    strategy:
      # Don't cancel the other OS builds if one leg fails.
      fail-fast: false
      # One at a time, deliberately. All three legs read-modify-write the SAME
      # latest.json on the release to merge in their platform entry; run them
      # concurrently and the last writer can drop another platform's entry.
      # The failure is invisible — that platform's users simply never see an
      # update — so trade ~20 minutes of wall clock for a correct manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The `bridge` submodule (agntchat/agntchat-bridge) is PUBLIC, so
          # secrets.GITHUB_TOKEN can init it. Recursive checkout pulls the bridge
          # sources that tauri.conf.json bundle.resources references (../bridge/*.py),
          # so the bundling step has everything it needs to build.
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Apple targets on macOS runners; native target on Windows.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # bundle.resources lists bridge files by name and by non-recursive glob,
      # and an unlisted file is silently absent from the built app — the first
      # symptom is a runtime failure in a shipped build. Cheap to check here,
      # expensive to find later.
      - name: Check bundle resources cover the bridge
        run: node scripts/check-bundle-resources.mjs

      # Tauri notarizes via APPLE_API_KEY_PATH, which wants a file on disk, but a
      # secret is a string. Write it out on the macOS legs only; RUNNER_TEMP is
      # wiped with the runner, so the key never outlives the job.
      - name: Stage the App Store Connect key for notarization
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/asc/AuthKey_${APPLE_API_KEY}.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (REQUIRED — see the header note) ---
          # Generated with `npx tauri signer generate`. The matching public key
          # is committed in src-tauri/tauri.conf.json. Lose this key and no
          # installed app will ever accept another update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code-signing (Developer ID) ---
          # Empty on the Windows leg, which is exactly how Tauri decides to skip
          # signing — so these can stay unconditional.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # --- Notarization, via the App Store Connect API key ---
          # The API-key route rather than APPLE_ID + app-specific password: no
          # 2FA, nothing tied to one person's Apple ID, same key that submits
          # the mobile app. Without notarization a signed build STILL trips
          # Gatekeeper — signing alone is not enough for a download.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "agntchat ${{ github.ref_name }}"
          releaseBody: |
            **agntchat is in beta.** Expect rough edges, and please report
            anything broken from Profile → Help in the app.

            Download the installer for your platform below.

            - **macOS (Apple Silicon)** — `_aarch64.dmg`
            - **macOS (Intel)** — `_x64.dmg`
            - **Windows** — `_x64-setup.exe`

            macOS builds are signed and notarized by Apple — they open
            normally. Windows is not yet signed, so choose
            **More info → Run anyway** on the SmartScreen prompt.

            Already running agntchat? You don't need this page — the app offers
            the update itself once this release is published.
          # Draft so James reviews before publishing to users. Publishing is
          # also what arms the in-app updater (see the header note).
          releaseDraft: true
          prerelease: false
          # Emit and upload `latest.json` — the manifest tauri-plugin-updater
          # polls. tauri-action merges each matrix leg's platform entry into the
          # single file on the release, so all three targets end up in one
          # manifest.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri notarizes and staples the .app, then wraps it in a .dmg that it
      # never notarizes. That gap is invisible until someone downloads it: the
      # DMG is what carries the quarantine flag, so macOS assesses the DMG on
      # open and refuses an unnotarized one — "Apple cannot check it for
      # malicious software" — even though the app inside is perfectly fine.
      #
      # The .app.tar.gz the updater consumes is already correct (stapled .app),
      # so this only matters for the fresh-install path. Verify with:
      #   spctl -a -t open --context context:primary-signature <file>.dmg
      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target -name '*.dmg' -not -name 'rw.*' | head -1)
          if [ -z "$DMG" ]; then echo "no .dmg found"; exit 1; fi
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          # Prove it before replacing the uploaded copy — a staple that silently
          # did nothing would otherwise ship looking fine.
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber \
            --repo "${{ github.repository }}"
